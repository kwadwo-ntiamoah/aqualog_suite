services:
  api:
    build:
      context: ./API
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      PORT: 8080
      # Real Firestore project + service account — same two values Render
      # needs (see render.yaml). Put them in a local .env file (gitignored)
      # rather than editing this file, e.g.:
      #   FIRESTORE_PROJECT_ID=your-dev-project
      #   FIRESTORE_CREDENTIALS_JSON={"type":"service_account",...}
      Firestore__ProjectId: "${FIRESTORE_PROJECT_ID}"
      Firestore__CredentialsJson: "${FIRESTORE_CREDENTIALS_JSON}"
      Cors__AllowedOrigins__0: "http://localhost:3000"
    ports:
      - "5260:8080"
