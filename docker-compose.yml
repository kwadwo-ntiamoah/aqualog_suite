services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: AquaLogDb
    volumes:
      - aqualog_pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./API
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      PORT: 8080
      ConnectionStrings__DbConnection: "Host=postgres;Port=5432;Database=AquaLogDb;Username=postgres;Password=postgres"
      Cors__AllowedOrigins__0: "http://localhost:3000"
    ports:
      - "5260:8080"

volumes:
  aqualog_pg_data:
