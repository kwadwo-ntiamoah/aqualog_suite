# Render Blueprint — deploys the API (from API/Dockerfile) as a single
# stateless web service. All persistent data lives in Google Cloud
# Firestore (external), so there's no disk and no second (paid) database
# service on Render at all.
#
# This is a starting point, not a guaranteed-correct file: Render's
# Blueprint schema does evolve, and this hasn't been applied against a real
# Render account. After importing it (Dashboard -> New -> Blueprint,
# pointing at this repo), check the preview Render shows you before
# applying, and fix up anything it flags.
#
# Manual step required after the first apply: a few env vars are marked
# `sync: false`, meaning Render won't set a value for them — you set it
# once in the dashboard.
#   - Firestore__ProjectId -> your GCP project ID
#   - Firestore__CredentialsJson -> the full JSON content of a GCP service
#     account key with Firestore access (Cloud Console -> IAM & Admin ->
#     Service Accounts -> your account -> Keys -> Add Key -> JSON), pasted
#     as one value
#   - JWT__Key -> a long random string (never reuse the dev value committed
#     in API/appsettings.json for production)
#   - Cors__AllowedOrigins__0 -> your deployed Vercel URL, e.g.
#     https://your-app.vercel.app (add more Cors__AllowedOrigins__1, __2,
#     ... for additional origins, e.g. a custom domain)

services:
  - type: web
    name: aqualog-api
    runtime: docker
    dockerfilePath: ./API/Dockerfile
    dockerContext: ./API
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: Firestore__ProjectId
        sync: false
      - key: Firestore__CredentialsJson
        sync: false
      - key: JWT__Key
        sync: false
      - key: JWT__Issuer
        value: issuer.aqualog
      - key: JWT__Audience
        value: audience.aqualog
      - key: Cors__AllowedOrigins__0
        sync: false
